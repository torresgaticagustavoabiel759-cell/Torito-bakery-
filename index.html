<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#66704A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Torito Bakery"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Torito Bakery</title><style>:root{--cream:#f7f1e3;--olive:#66704a;--dark:#2f3524;--card:#fffdf8;--red:#f4d6d2;--yellow:#f5e9bf}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}main{max-width:520px;margin:auto;padding:28px 18px 92px}.brand{font-weight:800;font-size:25px;color:var(--olive);letter-spacing:.3px}.sub{margin:3px 0 22px;opacity:.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 16px #3a402012}.label{font-size:13px;opacity:.65}.num{font-size:25px;font-weight:800;margin-top:5px}.scan{margin:16px 0;background:var(--olive);color:white;border:0;border-radius:18px;padding:17px;width:100%;font-size:17px;font-weight:700}.section{font-weight:800;font-size:18px;margin:24px 0 10px}.alert{background:var(--card);border-radius:15px;padding:13px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:12px}.danger{background:var(--red)}.warn{background:var(--yellow)}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ee;border-top:1px solid #ddd6c8;display:flex;justify-content:center;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}nav button{border:0;background:none;color:var(--dark);font-size:11px;padding:7px 9px}nav b{color:var(--olive)}small{opacity:.7}</style></head><body><main><div class="brand">TORITO BAKERY</div><div class="sub">Gestión de
